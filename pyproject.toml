[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lung-nodule-detection"
version = "0.5.0"
description = "Lung nodule detection in CT scans with patient-level evaluation on LUNA16."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jonathan Yesid Hernandez Bautista" }]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["medical-imaging", "computer-vision", "object-detection", "lung-nodule", "luna16"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
data = ["SimpleITK>=2.3", "Pillow>=10"]
train = ["SimpleITK>=2.3", "Pillow>=10", "ultralytics>=8.3"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "SimpleITK>=2.3",
    "Pillow>=10",
    "scikit-learn>=1.3",  # reference port of the official LUNA16 evaluation in the tests
]

[project.scripts]
lungnodule = "lungnodule.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
